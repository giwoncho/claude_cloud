<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D+Q — independent cross-cohort validation</title>
<style>body{margin:0;background:#eef1f5;font-family:"Segoe UI",Arial,sans-serif}.wrap{max-width:1280px;margin:12px auto;background:#fff;border-radius:12px;box-shadow:0 4px 22px rgba(0,0,0,.13);overflow:hidden}svg{display:block;width:100%;height:auto}</style>
</head><body><div class="wrap">
<svg viewBox="0 0 1240 700" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="hd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1a2b4a"/><stop offset="1" stop-color="#2b4673"/></linearGradient>
  <marker id="big" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#34495e"/></marker>
  <marker id="dq" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#7a5b00"/></marker>
</defs>

<rect x="0" y="0" width="1240" height="70" fill="url(#hd)"/>
<text x="28" y="32" font-size="22" font-weight="800" fill="#fff">Two independent mouse cohorts &#215; two modalities converge on the same D+Q program</text>
<text x="28" y="55" font-size="13" font-style="italic" fill="#cfe0f0">scRNA (cohort 1) and scATAC (cohort 2) are DIFFERENT mice — their agreement is an independent biological + technical validation, stronger than a single multiome cohort.</text>

<!-- ===== COHORT 1 : scRNA ===== -->
<rect x="28" y="96" width="300" height="250" rx="12" fill="#fef3f0" stroke="#c0392b" stroke-width="2"/>
<text x="178" y="122" text-anchor="middle" font-size="14" font-weight="800" fill="#a02a1c">COHORT 1 &#183; scRNA-seq</text>
<!-- mouse icon -->
<g transform="translate(40,132) scale(0.72)"><ellipse cx="28" cy="22" rx="30" ry="18" fill="#c98b7e" stroke="#8a4b3e"/><circle cx="6" cy="10" r="9" fill="#c98b7e" stroke="#8a4b3e"/><circle cx="3" cy="22" r="3.5" fill="#5a2d24"/><path d="M55,28 q22,4 26,-10" fill="none" stroke="#8a4b3e" stroke-width="2.4"/></g>
<text x="178" y="160" text-anchor="middle" font-size="11.5" fill="#3a3a3a">G11BM &#183; Veh n=4 / D+Q n=4</text>
<text x="178" y="178" text-anchor="middle" font-size="11.5" font-weight="700" fill="#a02a1c">175,316 cells (RNA)</text>
<line x1="178" y1="190" x2="178" y2="214" stroke="#7a5b00" stroke-width="2.4" marker-end="url(#dq)"/><text x="200" y="206" font-size="11" font-weight="700" fill="#7a5b00">D+Q</text>
<rect x="48" y="218" width="260" height="118" rx="8" fill="#fff" stroke="#d8a">
  <title>RNA program</title></rect>
<text x="178" y="238" text-anchor="middle" font-size="11.5" font-weight="800" fill="#1a2b4a">D+Q transcriptional program</text>
<text x="62" y="262" font-size="11.5" fill="#2166ac" font-weight="700">&#8595; stress / TNF-NF&#954;B (Fos, Egr1)</text>
<text x="62" y="286" font-size="11.5" fill="#16a085" font-weight="700">&#8593; proliferation (E2F, Myc, OXPHOS)</text>
<text x="62" y="310" font-size="11.5" fill="#e67e22" font-weight="700">&#8595; AP-1 inflammaging (Jun/Fos)</text>
<text x="62" y="330" font-size="10" fill="#666">DEG (pydeseq2)</text>

<!-- ===== COHORT 2 : scATAC ===== -->
<rect x="28" y="370" width="300" height="250" rx="12" fill="#eef6ff" stroke="#2166ac" stroke-width="2"/>
<text x="178" y="396" text-anchor="middle" font-size="14" font-weight="800" fill="#1a4d80">COHORT 2 &#183; scATAC-seq</text>
<g transform="translate(40,406) scale(0.72)"><ellipse cx="28" cy="22" rx="30" ry="18" fill="#8fa9c8" stroke="#3f5d80"/><circle cx="6" cy="10" r="9" fill="#8fa9c8" stroke="#3f5d80"/><circle cx="3" cy="22" r="3.5" fill="#243a56"/><path d="M55,28 q22,4 26,-10" fill="none" stroke="#3f5d80" stroke-width="2.4"/></g>
<text x="178" y="434" text-anchor="middle" font-size="11.5" fill="#3a3a3a">G4/G5/G7 &#183; different mice</text>
<text x="178" y="452" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a4d80">75,174 cells (ATAC)</text>
<line x1="178" y1="464" x2="178" y2="488" stroke="#7a5b00" stroke-width="2.4" marker-end="url(#dq)"/><text x="200" y="480" font-size="11" font-weight="700" fill="#7a5b00">D+Q</text>
<rect x="48" y="492" width="260" height="118" rx="8" fill="#fff" stroke="#9bd"/>
<text x="178" y="512" text-anchor="middle" font-size="11.5" font-weight="800" fill="#1a2b4a">D+Q chromatin program</text>
<text x="62" y="536" font-size="11.5" fill="#2166ac" font-weight="700">&#8595; stress / TNF-NF&#954;B (GeneScore)</text>
<text x="62" y="560" font-size="11.5" fill="#16a085" font-weight="700">&#8593; proliferation (E2F, Myc, OXPHOS)</text>
<text x="62" y="584" font-size="11.5" fill="#e67e22" font-weight="700">&#8595; AP-1 inflammaging (chromatin)</text>
<text x="62" y="604" font-size="10" fill="#666">GeneScore / ArchR P2G / ChromVAR</text>

<!-- ===== CONVERGENCE ===== -->
<line x1="332" y1="270" x2="470" y2="350" stroke="#34495e" stroke-width="3.5" marker-end="url(#big)"/>
<line x1="332" y1="450" x2="470" y2="372" stroke="#34495e" stroke-width="3.5" marker-end="url(#big)"/>
<ellipse cx="610" cy="360" rx="135" ry="120" fill="#eafaf1" stroke="#16a085" stroke-width="3"/>
<text x="610" y="300" text-anchor="middle" font-size="15" font-weight="800" fill="#0e5e4e">SAME D+Q program</text>
<text x="610" y="322" text-anchor="middle" font-size="11" fill="#117a65">(independent validation)</text>
<text x="610" y="352" text-anchor="middle" font-size="20" font-weight="800" fill="#117a65">r = 0.21</text>
<text x="610" y="372" text-anchor="middle" font-size="11" fill="#117a65">GeneScore&#916; vs RNA&#916; (p = 2&#215;10&#8315;&#185;&#178;&#8311;)</text>
<text x="610" y="398" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0e5e4e">82% direction-concordant</text>
<text x="610" y="416" text-anchor="middle" font-size="10.5" fill="#117a65">GS-up&#8745;DEG-up 21 (p=1e-4)</text>
<text x="610" y="432" text-anchor="middle" font-size="10.5" fill="#117a65">GS-down&#8745;DEG-down 12 (p=6e-9)</text>
<text x="610" y="500" text-anchor="middle" font-size="10" font-style="italic" fill="#888">validation at PROGRAM level (per-locus cis needs cell-matched multiome)</text>

<!-- ===== WHAT ATAC ADDS ===== -->
<line x1="745" y1="360" x2="828" y2="360" stroke="#34495e" stroke-width="3" marker-end="url(#big)"/>
<rect x="838" y="96" width="374" height="524" rx="12" fill="#faf7ec" stroke="#7a5b00" stroke-width="2"/>
<text x="1025" y="124" text-anchor="middle" font-size="14" font-weight="800" fill="#7a5b00">+ what scATAC ADDS beyond RNA</text>

<rect x="858" y="142" width="336" height="100" rx="9" fill="#fff" stroke="#16a085" stroke-width="1.8"/>
<text x="872" y="166" font-size="12.5" font-weight="800" fill="#117a65">&#9733; HSPC-specific coupling</text>
<text x="872" y="188" font-size="10.8" fill="#33404f">Of all BM cell types, ONLY HSPC couples</text>
<text x="872" y="205" font-size="10.8" fill="#33404f">TNF-NF&#954;B stress-OFF in BOTH chromatin</text>
<text x="872" y="222" font-size="10.8" fill="#33404f">&amp; RNA — a chromatin-resolved specificity</text>
<text x="872" y="236" font-size="10" fill="#888">(not visible from RNA alone)</text>

<rect x="858" y="254" width="336" height="92" rx="9" fill="#fff" stroke="#e67e22" stroke-width="1.8"/>
<text x="872" y="278" font-size="12.5" font-weight="800" fill="#a85b13">AP-1 inflammaging chromatin axis</text>
<text x="872" y="300" font-size="10.8" fill="#33404f">D+Q reverses the conserved AP-1 aging</text>
<text x="872" y="317" font-size="10.8" fill="#33404f">signature (Karakaslar 2023) at chromatin;</text>
<text x="872" y="334" font-size="10.8" fill="#33404f">HSPC commits it, T-cell poised.</text>

<rect x="858" y="358" width="336" height="92" rx="9" fill="#fff" stroke="#2166ac" stroke-width="1.8"/>
<text x="872" y="382" font-size="12.5" font-weight="800" fill="#1a4d80">Functional enhancer map (P2G)</text>
<text x="872" y="404" font-size="10.8" fill="#33404f">51,273 peak-to-gene links (69% distal,</text>
<text x="872" y="421" font-size="10.8" fill="#33404f">GeneIntegrationMatrix-based) — cis-</text>
<text x="872" y="438" font-size="10.8" fill="#33404f">regulatory architecture of the program.</text>

<rect x="858" y="462" width="336" height="92" rx="9" fill="#fff" stroke="#8e44ad" stroke-width="1.8"/>
<text x="872" y="486" font-size="12.5" font-weight="800" fill="#6d3091">Identity preserved (armed-but-quiet)</text>
<text x="872" y="508" font-size="10.8" fill="#33404f">Self-renewal TF loci (Hlf/Mecom/Meis1)</text>
<text x="872" y="525" font-size="10.8" fill="#33404f">keep accessibility + footprint while RNA</text>
<text x="872" y="542" font-size="10.8" fill="#33404f">dips = chromatin-stored identity.</text>

<text x="1025" y="582" text-anchor="middle" font-size="10" font-style="italic" fill="#7a5b00">decisive confirmation: sorted-LT-HSC CUT&amp;Tag (H3K4me3+H3K27me3)</text>
<text x="1025" y="600" text-anchor="middle" font-size="10" font-style="italic" fill="#7a5b00">+ ligand perturbation &#8594; cohort-matched cis &amp; causality</text>

<rect x="0" y="668" width="1240" height="32" fill="#1a2b4a"/>
<text x="620" y="688" text-anchor="middle" font-size="10.5" fill="#cfe0f0">Independent cross-cohort, cross-modality validation of the D+Q bone-marrow program &#183; Cho / Varghese Lab v11 &#183; 2026-05-27</text>
</svg>
</div></body></html>
